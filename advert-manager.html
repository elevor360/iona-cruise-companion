<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iona Advert Manager</title><style>body{font:16px system-ui;max-width:700px;margin:30px auto;padding:20px;background:#f0f4f8;color:#173049}section{background:white;padding:20px;border-radius:12px}label{display:block;margin:14px 0 5px;font-weight:bold}input:not([type=checkbox]),textarea{width:100%;padding:10px;box-sizing:border-box}button{padding:12px;background:#17496e;color:white;border:0;border-radius:8px;margin:12px 4px 0 0}</style><section><h1>Elevor360D Iona Advert Manager</h1><p>Load an existing advert-settings.json to edit it, or create a new one. Export and upload the resulting JSON to your GitHub Pages repository. Media files must also be uploaded to the repository, or hosted at a valid HTTPS URL.</p><label>Import existing settings</label><input id="import" type="file" accept=".json"><label><input id="enabled" type="checkbox"> Enable adverts</label><label>Image path or HTTPS URL</label><input id="image" placeholder="ads/advert.jpg"><label>Video path or HTTPS URL (used if no image)</label><input id="video" placeholder="ads/video.mp4"><label>Advert link HTTPS URL</label><input id="link" placeholder="https://..."><label>Caption</label><input id="caption" value="Elevor360D Apps"><h3>Placement</h3><label><input class="place" type="checkbox" value="home" checked> Home</label><label><input class="place" type="checkbox" value="venues" checked> Bars & Dining</label><label><input class="place" type="checkbox" value="entertainment" checked> Entertainment</label><button id="export">Download advert-settings.json</button></section><script>const $=s=>document.querySelector(s);$('#import').onchange=async()=>{try{let d=JSON.parse(await $('#import').files[0].text());$('#enabled').checked=!!d.enabled;for(let k of ['image','video','link','caption'])$('#'+k).value=d[k]||'';document.querySelectorAll('.place').forEach(x=>x.checked=(d.placements||[]).includes(x.value));alert('Settings imported')}catch(e){alert('Could not import JSON: '+e.message)}};$('#export').onclick=()=>{let d={enabled:$('#enabled').checked,image:$('#image').value.trim(),video:$('#video').value.trim(),link:$('#link').value.trim(),caption:$('#caption').value.trim(),placements:[...document.querySelectorAll('.place:checked')].map(x=>x.value)};let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='advert-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}</script></html>
